<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collector Dashboard | CleanCity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" />
    <link rel="stylesheet" href="/public/CSS/collector.dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Main Content Area -->
        <main class="main-content">
            <header class="content-header">
                <h1><i class="fa-solid fa-route"></i> Your Route</h1>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name" id="collectorName">Loading...</span>
                        <span class="user-role">Collector</span>
                    </div>
                    <button class="logout-btn" id="logoutBtn" title="Logout">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </header>

            <!-- Stats Cards -->
            <section class="stats-container">
                <div class="stat-card">
                    <i class="fa-solid fa-list-check"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="totalAssigned">0</div>
                        <div class="stat-label">Total Assigned</div>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-hourglass-start"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="pendingPickups">0</div>
                        <div class="stat-label">Pending Pickups</div>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-truck-fast"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="inTransit">0</div>
                        <div class="stat-label">In Transit</div>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-flag-checkered"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="deliveredPickups">0</div>
                        <div class="stat-label">Delivered Today</div>
                    </div>
                </div>
            </section>

            <!-- Task List & Chart -->
            <div class="content-grid">
                <section class="task-list-section">
                    <h2><i class="fa-solid fa-clipboard-list"></i> Task List</h2>
                    <div class="task-list" id="taskList">
                        <!-- Tasks will be loaded here by JavaScript -->
                        <p class="no-data">No assigned pickups found.</p>
                    </div>
                </section>
                <section class="chart-section">
                    <h2><i class="fa-solid fa-chart-pie"></i> Pickup Status</h2>
                    <div class="chart-container">
                        <canvas id="pickupStatusChart"></canvas>
                    </div>
                </section>
            </div>
        </main>

        <!-- Map Sidebar -->
        <aside class="map-sidebar">
            <div id="collectionMap"></div>
            <div class="map-controls">
                <button id="locateMeBtn" title="Center on my location"><i class="fa-solid fa-location-crosshairs"></i></button>
                <button id="refreshMapBtn" title="Refresh pickups"><i class="fa-solid fa-sync-alt"></i></button>
            </div>
        </aside>
    </div>

    <!-- Details Modal -->
    <div class="overlay" id="detailsOverlay">
        <div class="modal">
            <button class="close-modal" id="closeModalBtn">&times;</button>
            <h2>Pickup Details</h2>
            <div class="modal-content" id="modalContent">
                <!-- Details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Snackbar for notifications -->
    <div id="snackbar"></div>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
    <script src="/public/JS/collector.dashboard.js"></script>
</body>
</html>
