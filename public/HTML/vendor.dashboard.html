<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard | CleanCity Energy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="/public/CSS/vendor.dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="dashboard-wrapper">
        <header class="dashboard-header">
            <div class="header-title">
                <h1><i class="fa-solid fa-solar-panel"></i> Energy Production Dashboard</h1>
                <span id="vendorName" class="vendor-name">Loading...</span>
            </div>
            <div class="header-actions">
                <button id="refreshBtn" class="header-btn" title="Refresh Data"><i
                        class="fa-solid fa-sync-alt"></i></button>
                <button id="logoutBtn" class="header-btn logout" title="Logout"><i
                        class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="dashboard-content">
            <!-- Stats -->
            <section class="stats-container">
                <div class="stat-card">
                    <i class="fa-solid fa-leaf"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="totalCo2Reduced">0 kg</div>
                        <div class="stat-label">CO₂ Reduced</div>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-bolt"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="totalEnergyProduced">0 kWh</div>
                        <div class="stat-label">Energy Produced</div>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-recycle"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="totalWasteProcessed">0 kg</div>
                        <div class="stat-label">Waste Processed</div>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-cubes-stacked"></i>
                    <div class="stat-info">
                        <div class="stat-value" id="totalAvailableBins">0</div>
                        <div class="stat-label">Bins Available</div>
                    </div>
                </div>
            </section>

            <!-- Main Grid -->
            <div class="content-grid">
                <section class="bins-section">
                    <div class="section-header">
                        <h2><i class="fa-solid fa-magnifying-glass"></i> Available Bins for Collection</h2>
                        <select id="wasteTypeFilter">
                            <option value="all">All Waste Types</option>
                        </select>
                    </div>
                    <div class="action-bar">
                        <button id="selectAllBtn">Select All</button>
                        <button id="requestSelectedBtn" disabled><i class="fa-solid fa-truck-fast"></i> Request Selected
                            (<span id="selectedCount">0</span>)</button>
                    </div>
                    <div class="bins-grid" id="binsGrid">
                        <!-- Bins will be loaded here -->
                    </div>
                </section>

                <div class="right-column">
                    <section class="awaiting-processing-section">
                        <h2><i class="fa-solid fa-clock"></i> Awaiting Processing</h2>
                        <div class="processing-list" id="awaitingProcessingList"></div>
                    </section>

                    <section class="requested-deliveries-section">
                        <h2><i class="fa-solid fa-truck-arrow-right"></i> Requested Deliveries</h2>
                        <div class="delivery-list" id="requestedDeliveriesList"></div>
                    </section>

                    <section class="processed-deliveries-section">
                        <h2><i class="fa-solid fa-check-circle"></i> Processed Deliveries</h2>
                        <div class="delivery-list" id="processedDeliveriesList"></div>
                    </section>

                    <section class="chart-section">
                        <h2><i class="fa-solid fa-chart-pie"></i> Waste Processed by Type</h2>
                        <div class="chart-container">
                            <canvas id="wasteTypeChart"></canvas>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <!-- Bin Details Modal -->
    <div class="overlay" id="detailsOverlay">
        <div class="modal">
            <button class="close-modal" id="closeDetailsModal">&times;</button>
            <div id="detailsModalContent">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

    <!-- Mark Processed Modal -->
    <div class="overlay" id="processOverlay">
        <div class="modal process-modal">
            <button class="close-modal" id="closeProcessModal">&times;</button>
            <h2>Finalize Processing</h2>
            <form id="processForm">
                <p>Enter the final metrics for Request ID: <strong id="processRequestId"></strong></p>
                <div class="form-group">
                    <label for="energyGenerated">Energy Generated (kWh)</label>
                    <input type="number" id="energyGenerated" required step="0.1" placeholder="e.g., 150.5">
                </div>
                <div class="form-group">
                    <label for="co2Reduced">CO₂ Reduced (kg)</label>
                    <input type="number" id="co2Reduced" required step="0.1" placeholder="e.g., 25.2">
                </div>
                <div class="form-group">
                    <label for="processingMethod">Processing Method</label>
                    <input type="text" id="processingMethod" required placeholder="e.g., Pyrolysis, Recycling">
                </div>
                <button type="submit" class="modal-btn btn-confirm"><i class="fa-solid fa-check-double"></i> Confirm &
                    Complete</button>
            </form>
        </div>
    </div>

    <div id="snackbar"></div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <script src="/public/JS/vendor.dashboard.js"></script>
</body>

</html>
