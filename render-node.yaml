services:
  - type: web
    name: waste-main-app
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        fromSecret: MONGODB_URI
      - key: ML_SERVICE_URL
        value: https://waste-ml-service.onrender.com
    plan: free